server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 600M;
    gzip on; gzip_vary on; gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location = /api/epss { alias /var/cache/cve-data/epss.json; default_type application/json; }
    location = /api/nuclei { alias /var/cache/cve-data/nuclei.json; default_type application/json; }
    location = /api/metasploit { alias /var/cache/cve-data/metasploit.json; default_type application/json; }
    location = /api/exploitdb { alias /var/cache/cve-data/exploitdb.json; default_type application/json; }
    location = /api/et-rules { alias /var/cache/cve-data/et_rules.json; default_type application/json; }
    location = /api/kev { alias /var/cache/cve-data/kev.json; default_type application/json; }
    location /api/analysis { proxy_pass http://127.0.0.1:5000; proxy_set_header Host $host; proxy_read_timeout 660s; proxy_send_timeout 660s; client_max_body_size 600M; }
    location /api/inhouse { proxy_pass http://127.0.0.1:5000; proxy_set_header Host $host; proxy_read_timeout 60s; client_max_body_size 100M; }
    location /api/cache { proxy_pass http://127.0.0.1:5000; proxy_set_header Host $host; proxy_read_timeout 300s; }
    location / { try_files $uri $uri/ /index.html; }
    location = /health { access_log off; return 200 "ok"; add_header Content-Type text/plain; }
}
